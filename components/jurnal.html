<!-- components/jurnal.html -->
<div class="space-y-6">
  <!-- HEADER MODUL -->
  <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex flex-col md:flex-row md:items-center justify-between gap-4">
    <div>
      <h2 class="text-lg font-black text-slate-800 uppercase tracking-wide">Jurnal Perkuliahan</h2>
      <p class="text-xs text-slate-500 font-medium">Catatan materi harian, refleksi mengajar, dan rekap perkuliahan.</p>
    </div>
    <!-- TOMBOL BUKA MODAL EKSPOR -->
    <button id="btnOpenModalEksporJurnal" class="px-4 py-2 text-xs font-extrabold rounded-xl bg-amber-500 hover:bg-amber-600 text-white shadow-sm transition-all flex items-center gap-2 self-start md:self-auto">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
      Unduh Laporan Jurnal
    </button>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
    <!-- FORM INPUT JURNAL -->
    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
      <h3 id="formJurnalTitle" class="text-xs font-extrabold text-slate-700 uppercase mb-4 tracking-wider">Tambah Jurnal Mengajar</h3>
      <form id="formJurnal" class="space-y-3">
        <input type="hidden" id="jurnal_id" value="">
        <div>
          <label class="block text-[11px] font-extrabold text-slate-600 mb-1">Mata Kuliah</label>
          <select id="jurnalSelectMK" required class="w-full px-3 py-2 text-xs border border-slate-300 rounded-xl focus:ring-2 focus:ring-amber-400 focus:outline-none font-bold">
            <option value="">-- Pilih Mata Kuliah --</option>
          </select>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-[11px] font-extrabold text-slate-600 mb-1">Pertemuan Ke-</label>
            <input type="number" id="jurnal_pertemuan" min="1" placeholder="1" required class="w-full px-3 py-2 text-xs border border-slate-300 rounded-xl focus:ring-2 focus:ring-amber-400 focus:outline-none font-bold text-amber-700 bg-amber-50">
          </div>
          <div>
            <label class="block text-[11px] font-extrabold text-slate-600 mb-1">Tanggal</label>
            <input type="date" id="jurnal_tanggal" required class="w-full px-3 py-2 text-xs border border-slate-300 rounded-xl focus:ring-2 focus:ring-amber-400 focus:outline-none">
          </div>
        </div>
        <div>
          <label class="block text-[11px] font-extrabold text-slate-600 mb-1">Ruang / Tempat Mengajar <span class="font-normal text-slate-400">(Opsional)</span></label>
          <input type="text" id="jurnal_tempat" placeholder="Misal: Lab Komputer 2" class="w-full px-3 py-2 text-xs border border-slate-300 rounded-xl focus:ring-2 focus:ring-amber-400 focus:outline-none">
        </div>
        <div>
          <label class="block text-[11px] font-extrabold text-slate-600 mb-1">Judul Materi</label>
          <input type="text" id="jurnal_judul" placeholder="Misal: Pengenalan Web HTML" required class="w-full px-3 py-2 text-xs border border-slate-300 rounded-xl focus:ring-2 focus:ring-amber-400 focus:outline-none font-bold">
        </div>
        <div>
          <label class="block text-[11px] font-extrabold text-slate-600 mb-1">Deskripsi Materi <span class="font-normal text-slate-400">(Opsional)</span></label>
          <textarea id="jurnal_deskripsi" rows="3" placeholder="Uraian ringkas materi..." class="w-full px-3 py-2 text-xs border border-slate-300 rounded-xl focus:ring-2 focus:ring-amber-400 focus:outline-none"></textarea>
        </div>
        <div>
          <label class="block text-[11px] font-extrabold text-slate-600 mb-1">Catatan Evaluasi <span class="font-normal text-slate-400">(Opsional)</span></label>
          <textarea id="jurnal_refleksi" rows="2" placeholder="Kendala kelas..." class="w-full px-3 py-2 text-xs border border-slate-300 rounded-xl focus:ring-2 focus:ring-amber-400 focus:outline-none"></textarea>
        </div>
        <div class="flex gap-2 pt-2">
          <button type="submit" class="flex-1 bg-amber-500 hover:bg-amber-600 text-white font-bold py-2.5 rounded-xl text-xs transition-all shadow-md">Simpan Jurnal</button>
          <button type="button" id="btnBatalJurnal" class="hidden px-3 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-2.5 rounded-xl text-xs">Batal</button>
        </div>
      </form>
    </div>

    <!-- TABEL RIWAYAT JURNAL DENGAN FILTER & CARI -->
    <div class="lg:col-span-2 bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-4">
      <div class="flex flex-col sm:flex-row justify-between sm:items-center gap-3">
        <h3 class="text-xs font-extrabold text-slate-700 uppercase tracking-wider">Riwayat Jurnal Mengajar</h3>
      </div>

      <!-- BARIS FILTER MK & SEARCHBOX -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 bg-slate-50 p-3 rounded-xl border border-slate-200">
        <div>
          <label class="block text-[10px] font-extrabold text-slate-500 uppercase mb-1">Filter Mata Kuliah</label>
          <select id="filterRiwayatMK" class="w-full px-3 py-1.5 text-xs border border-slate-300 rounded-lg font-bold text-slate-800 bg-white focus:outline-none">
            <option value="">-- Semua Mata Kuliah --</option>
          </select>
        </div>
        <div>
          <label class="block text-[10px] font-extrabold text-slate-500 uppercase mb-1">Cari Materi / Kelas</label>
          <input type="text" id="searchRiwayatText" placeholder="Ketik kata kunci..." class="w-full px-3 py-1.5 text-xs border border-slate-300 rounded-lg bg-white focus:outline-none">
        </div>
      </div>

      <!-- TABEL RIWAYAT -->
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs border-collapse">
          <thead>
            <tr class="bg-slate-100 border-b border-slate-200 text-slate-600 font-extrabold uppercase text-[10px]">
              <th class="p-3">P-Ke / Tgl</th>
              <th class="p-3">Mata Kuliah</th>
              <th class="p-3">Materi</th>
              <th class="p-3 text-center">Aksi</th>
            </tr>
          </thead>
          <tbody id="listJurnalTable" class="divide-y divide-slate-100">
            <!-- Dinamis JS -->
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- ========================================== -->
<!-- MODAL POP-UP EKSPOR LAPORAN JURNAL          -->
<!-- ========================================== -->
<div id="modalEksporJurnal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
  <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl border border-slate-200 p-6 space-y-4">
    <div class="flex justify-between items-center border-b border-slate-100 pb-3">
      <h3 class="text-sm font-black text-slate-800 uppercase">Parameter Unduh Jurnal</h3>
      <button id="btnCloseModalEkspor" class="text-slate-400 hover:text-slate-600 font-bold text-lg">&times;</button>
    </div>

    <div class="space-y-3">
      <!-- 1. OPSI MATA KULIAH -->
      <div>
        <label class="block text-[11px] font-extrabold text-slate-700 mb-1">Cakupan Kelas</label>
        <select id="exportSelectMK" class="w-full px-3 py-2 text-xs border border-slate-300 rounded-xl font-bold text-slate-800 focus:outline-none">
          <option value="">-- Semua Mata Kuliah (Default) --</option>
        </select>
      </div>

      <!-- 2. OPSI TIPE RENTANG WAKTU -->
      <div>
        <label class="block text-[11px] font-extrabold text-slate-700 mb-1">Mode Filter Waktu</label>
        <select id="exportModeWaktu" class="w-full px-3 py-2 text-xs border border-slate-300 rounded-xl font-bold text-slate-800 focus:outline-none">
          <option value="semua">Semua Periode</option>
          <option value="tanggal">Berdasarkan Rentang Tanggal</option>
          <option value="bulan">Berdasarkan Bulan & Tahun</option>
        </select>
      </div>

      <!-- SUB FILTER A: RENTANG TANGGAL -->
      <div id="subFilterTanggal" class="hidden grid grid-cols-2 gap-2 bg-amber-50 p-3 rounded-xl border border-amber-200">
        <div>
          <label class="block text-[10px] font-extrabold text-slate-600 mb-1">Dari Tanggal</label>
          <input type="date" id="exportTglMulai" class="w-full px-2 py-1.5 text-xs border border-slate-300 rounded-lg bg-white">
        </div>
        <div>
          <label class="block text-[10px] font-extrabold text-slate-600 mb-1">Sampai Tanggal</label>
          <input type="date" id="exportTglSelesai" class="w-full px-2 py-1.5 text-xs border border-slate-300 rounded-lg bg-white">
        </div>
      </div>

      <!-- SUB FILTER B: BULAN & TAHUN -->
      <div id="subFilterBulan" class="hidden grid grid-cols-2 gap-2 bg-amber-50 p-3 rounded-xl border border-amber-200">
        <div>
          <label class="block text-[10px] font-extrabold text-slate-600 mb-1">Pilih Bulan</label>
          <select id="exportBulan" class="w-full px-2 py-1.5 text-xs border border-slate-300 rounded-lg bg-white font-bold">
            <option value="1">Januari</option>
            <option value="2">Februari</option>
            <option value="3">Maret</option>
            <option value="4">April</option>
            <option value="5">Mei</option>
            <option value="6">Juni</option>
            <option value="7">Juli</option>
            <option value="8">Agustus</option>
            <option value="9">September</option>
            <option value="10">Oktober</option>
            <option value="11">November</option>
            <option value="12">Desember</option>
          </select>
        </div>
        <div>
          <label class="block text-[10px] font-extrabold text-slate-600 mb-1">Pilih Tahun</label>
          <input type="number" id="exportTahun" value="2026" min="2020" max="2030" class="w-full px-2 py-1.5 text-xs border border-slate-300 rounded-lg bg-white font-bold">
        </div>
      </div>
    </div>

    <!-- TOMBOL EKSEKUSI UNDUH -->
    <div class="pt-3 border-t border-slate-100 flex gap-2">
      <button id="btnDoExportExcel" class="flex-1 bg-teal-600 hover:bg-teal-700 text-white font-bold py-2.5 rounded-xl text-xs transition-all shadow-md flex items-center justify-center gap-1.5">
        📊 Unduh Excel (.xlsx)
      </button>
      <button id="btnDoExportPDF" class="flex-1 bg-red-600 hover:bg-red-700 text-white font-bold py-2.5 rounded-xl text-xs transition-all shadow-md flex items-center justify-center gap-1.5">
        📄 Unduh PDF (.pdf)
      </button>
    </div>
  </div>
</div>
